server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (e.g. /regwatch) must resolve to
    # index.html so react-router can take over, not 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
